<nav aria-label="Flair library">
	<form class="section-form" action="/library/" method="get">
		<label>
			<span>Flair /</span>
			<select name="section">
				<option value="home">Homepage</option>
				<option value="typography">01 / Typography</option>
				<option value="controls">02 / Controls</option>
				<option value="forms">03 / Forms</option>
				<option value="surfaces">04 / Surfaces</option>
				<option value="navigation">05 / Navigation</option>
				<option value="disclosures">06 / Disclosures</option>
				<option value="tables">07 / Tables</option>
				<option value="feedback">08 / Feedback</option>
				<option value="code">09 / Code</option>
				<option value="layouts">10 / Layouts</option>
				<option value="playground">Playground</option>
			</select>
		</label>
		<button type="submit">Go</button>
	</form>
	<form class="theme-form" method="get">
		<label>
			<span>Theme</span>
			<select name="theme">
				<option value="ink">Monochrome</option>
				<option value="paper">Paper</option>
				<option value="vivid">Vivid</option>
				<option value="github">GitHub</option>
				<option value="material">Material</option>
				<option value="clean-dashboard">Clean dashboard</option>
			</select>
		</label>
		<div class="appearance-control" role="group" aria-label="Colour scheme and colours">
			<input type="hidden" name="scheme" value="system">
			<label class="scheme-choice" title="Light mode — select again for system default">
				<input type="radio" name="scheme" value="light" aria-label="Light mode">
				<span aria-hidden="true">☀</span>
			</label>
			<label class="scheme-choice" title="Dark mode — select again for system default">
				<input type="radio" name="scheme" value="dark" aria-label="Dark mode">
				<span aria-hidden="true">☾</span>
			</label>
			<label class="colour-choice primary-choice" title="Primary colour — button backgrounds">
				<input type="color" name="primary" value="#111111" aria-label="Primary colour">
			</label>
			<label class="colour-choice tint-choice" title="Tint colour — outlines and accents">
				<input type="color" name="tint" value="#111111" aria-label="Tint colour">
			</label>
		</div>
		<input type="hidden" name="tint-preset" value="#111111">
		<input type="hidden" name="primary-preset" value="#111111">
		<button type="submit">Apply</button>
	</form>
</nav>
